<!-- 6. Important Tags in HTML -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Important tags in HTML</title>
  </head>
  <body>
    <h1>Heading</h1>
    <p>Paragraph</p>
    <a href="https://www.google.com">Google</a>
    <img
      src="https://www.shutterstock.com/image-photo/fresh-apple-this-healthy-good-600nw-2443626143.jpg"
      alt="Apple"
    />

    <table style="border: 2px dotted black">
      <tr>
        <th>Name</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Notebook</td>
        <td>45</td>
      </tr>
      <tr>
        <td>Cold Drink</td>
        <td>97</td>
      </tr>
      <tr>
        <td>Chocobar</td>
        <td>38</td>
      </tr>
      <tr>
        <td>Water</td>
        <td>30</td>
      </tr>
    </table>

    <h3>Orderd List & Unorderd List</h3>
    <ol>
      <li>Biscuit</li>
      <li>Chocolet</li>
      <li>Cold Drinks</li>
    </ol>

    <ul>
      <li>Biscuit</li>
      <li>Chocolet</li>
      <li>Cold Drinks</li>
    </ul>
  </body>
</html>
